# Test Environment In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:campushub_testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT: dummy secret for automated tests only
app.jwt.secret=test-only-secret-key-for-campusphere-12345678901234567890

# Cloudinary: dummy values, never real account credentials
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-api-key
cloudinary.api-secret=test-api-secret

app.ai.provider=mock

app.resource.max-file-size-mb=10
app.resource.allowed-extensions=pdf,doc,docx,ppt,pptx,xls,xlsx,txt,jpg,jpeg,png

# Upscrape: dummy key, never a real API key
app.upscrape.api-key=test-upscrape-key
app.upscrape.base-url=https://mock.upscrape.com
app.upscrape.connect-timeout-ms=2000
app.upscrape.read-timeout-ms=2000
app.upscrape.wait-seconds=5
app.internshala.sync.enabled=false
app.internshala.sync.cron=0 0 2 * * ?
app.internshala.sync.default-limit=10
app.internshala.sync.default-keywords=computer science
